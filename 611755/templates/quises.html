<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizt - Elige tu Desafío</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="page-quises">
    <div class="explore-header">
        <h1>Nuestros Cuestionarios</h1>
        <p>Selecciona el área que deseas explorar hoy y pon a prueba tu perspectiva habitual.</p>
    </div>

    <div class="grid-container">
        {% for quiz in quises %}
        <div class="quiz-card">
            <div class="card-icon">🧠</div>
            <h3 class="card-title">{{ quiz.name }}</h3>
            <p class="card-description">{{ quiz.desc }}</p>
            
            <form action="{{ url_for('quises_selection') }}" method="post">
                <input type="hidden" name="quiz_id" value="{{ quiz.id }}">
                <button type="submit" class="btn-card">Comenzar Desafío</button>
            </form>
        </div>
        {% endfor %}
    </div>

    <p style="margin-top: 40px;"><a href="{{ url_for('index') }}" style="color: #475569; font-weight:600; text-decoration: none;">← Volver al Inicio</a></p>
</body>

</html>
